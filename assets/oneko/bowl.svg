<svg xmlns="http://www.w3.org/2000/svg" width="108" height="22" viewBox="0 0 108 22">
  <!-- Three 36x22 frames side by side: empty, half full, full. -->
  <defs>
    <g id="dish" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 10.5 0.9 18.8Q.5 21.5 3.3 21.5H32.7Q35.5 21.5 35.1 18.8L33.5 10.5" fill="#d8d8d8"/>
      <ellipse cx="18" cy="10.5" rx="15.5" ry="3" fill="#bdbdbd"/>
      <path d="M5.3 14.9 4.6 18.6" stroke="#fff" stroke-width="1.7"/>
      <path d="M12 17.5H22.5M12 17.5l-2-2M12 17.5l-2 2M14.8 17.5l-1.3-2.1M14.8 17.5l-1.3 2.1M17.6 17.5l-1.3-2.1M17.6 17.5l-1.3 2.1M20.4 17.5l-1.3-2.1M20.4 17.5l-1.3 2.1"/>
      <path d="M22.5 15.6 26 17.5 22.5 19.4Z" fill="#d8d8d8"/>
      <circle cx="23.7" cy="17.2" r=".42" fill="#000" stroke="none"/>
    </g>
    <!-- Food shows above the rim and inside the opening, never over the front wall. -->
    <clipPath id="inside">
      <rect x="0" y="-4" width="36" height="14.5"/>
      <ellipse cx="18" cy="10.5" rx="15" ry="2.5"/>
    </clipPath>
    <g id="half-pile">
      <circle cx="9.8" cy="11.4" r="2.2"/>
      <circle cx="13.9" cy="11.7" r="2.2"/>
      <circle cx="18" cy="11.8" r="2.2"/>
      <circle cx="22.1" cy="11.7" r="2.2"/>
      <circle cx="26.2" cy="11.4" r="2.2"/>
      <circle cx="16" cy="9.3" r="2.2"/>
      <circle cx="20" cy="9.3" r="2.2"/>
    </g>
    <g id="full-pile">
      <circle cx="7.8" cy="11" r="2.2"/>
      <circle cx="11.9" cy="11.5" r="2.2"/>
      <circle cx="16" cy="11.7" r="2.2"/>
      <circle cx="20" cy="11.7" r="2.2"/>
      <circle cx="24.1" cy="11.5" r="2.2"/>
      <circle cx="28.2" cy="11" r="2.2"/>
      <circle cx="11.9" cy="8.8" r="2.2"/>
      <circle cx="16" cy="8.5" r="2.2"/>
      <circle cx="20" cy="8.5" r="2.2"/>
      <circle cx="24.1" cy="8.8" r="2.2"/>
      <circle cx="16" cy="6.3" r="2.2"/>
      <circle cx="20" cy="6.3" r="2.2"/>
    </g>
  </defs>

  <use href="#dish"/>

  <g transform="translate(36)">
    <use href="#dish"/>
    <g clip-path="url(#inside)">
      <use href="#half-pile" fill="#c99660" stroke="#000" stroke-width="2"/>
      <use href="#half-pile" fill="#c99660" stroke="#8f5f33" stroke-width=".7"/>
    </g>
  </g>

  <g transform="translate(72)">
    <use href="#dish"/>
    <g clip-path="url(#inside)">
      <use href="#full-pile" fill="#c99660" stroke="#000" stroke-width="2"/>
      <use href="#full-pile" fill="#c99660" stroke="#8f5f33" stroke-width=".7"/>
    </g>
  </g>
</svg>
